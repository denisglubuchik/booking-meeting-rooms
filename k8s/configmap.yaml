apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-config
  namespace: booking
data:
  PG_HOST: "pgbouncer"
  PG_PORT: "5432"
  PG_DB: "booking_db"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  APP_REDIS_PREFIX: "booking"

  CORS_ALLOW_ORIGINS: "https://booking.localhost"
  REFRESH_COOKIE_PATH: "/api/v1/auth"
  REFRESH_COOKIE_SECURE: "true"

  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_ENDPOINT_URL: "https://s3.booking.localhost"
  S3_REGION: "us-east-1"
  S3_BUCKET: "booking"
  S3_USE_PATH_STYLE: "true"
