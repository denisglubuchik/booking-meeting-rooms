name: booking-prod

volumes:
  postgres_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:

services:
  tempo:
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -backend-scheduler.provider.work.compaction.block-retention=168h
    volumes:
      - ./k8s/observability/configs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4317"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./k8s/observability/configs/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"

  loki-init:
    image: busybox:1.37.0
    user: "0"
    command: ["chown", "10001:10001", "/var/loki"]
    volumes:
      - loki_data:/var/loki

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./k8s/observability/configs/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/var/loki
    expose:
      - "3100"
    depends_on:
      loki-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./k8s/observability/configs/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./k8s/observability/configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/observability.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./k8s/observability/configs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"
    mem_limit: 256m
    depends_on:
      - tempo
      - loki

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_db}
      POSTGRES_USER: ${POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking_user} -d ${POSTGRES_DB:-booking_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${POSTGRES_USER:-booking_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-booking_password}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-booking_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${POSTGRES_USER:-booking_user}
      ADMIN_USERS: ${POSTGRES_USER:-booking_user}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-booking_user}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && cd /code/src && uv run uvicorn api.main:app --host 0.0.0.0 --port 8000"
      ]
    env_file:
      - ./backend/.env.prod
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      otel-collector:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["sh", "./start-worker.sh"]
    env_file:
      - ./backend/.env.prod
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      otel-collector:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend/vue-app
      dockerfile: frontend/vue-app/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
