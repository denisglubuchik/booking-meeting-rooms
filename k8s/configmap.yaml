apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-config
  namespace: booking
data:
  APP_VERSION: "1.0.0"

  OTEL_SDK_DISABLED: "false"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=booking-meeting-rooms,deployment.environment.name=kubernetes"

  PG_RW_HOST: "booking-pooler-rw"
  PG_RO_HOST: "booking-pooler-ro"
  PG_PORT: "5432"
  PG_DB: "booking_db"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  APP_REDIS_PREFIX: "booking"

  CORS_ALLOW_ORIGINS: "http://booking.localhost"
  REFRESH_COOKIE_PATH: "/api/v1/auth"
  REFRESH_COOKIE_SECURE: "false"

  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_ENDPOINT_URL: "http://s3.booking.localhost"
  S3_REGION: "us-east-1"
  S3_BUCKET: "booking"
  S3_USE_PATH_STYLE: "true"
