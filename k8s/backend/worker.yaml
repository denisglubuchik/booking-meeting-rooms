apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: booking
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: booking-backend:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          command:
            - /bin/sh
            - -c
          args:
            - cd /code/src && exec uv run --no-sync python -m worker.main
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
