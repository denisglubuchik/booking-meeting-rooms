volumes:
  pg_data: { }
  tempo_data: { }
  prometheus_data: { }
  loki_data: { }
  grafana_data: { }


services:
  tempo:
    image: grafana/tempo:3.0.3
    command:
      - -config.file=/etc/tempo/tempo.yaml
      - -backend-scheduler.provider.work.compaction.block-retention=168h
    volumes:
      - ../k8s/observability/configs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../k8s/observability/configs/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki-init:
    image: busybox:1.37.0
    user: "0"
    command: ["chown", "10001:10001", "/var/loki"]
    volumes:
      - loki_data:/var/loki

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../k8s/observability/configs/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/var/loki
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      loki-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../k8s/observability/configs/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../k8s/observability/configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/observability.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../k8s/observability/configs/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    mem_limit: 256m
    depends_on:
      - tempo
      - loki

  app:
    build: .
    command: "sh ./start.sh"
    env_file: .env.dev
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      - db
      - otel-collector
#    restart: always
    ports:
      - "8000:8000"
    volumes:
      - "./src:/code/src"
      - "./pyproject.toml:/code/pyproject.toml"
    tty: true

  worker:
    build: .
    command: "sh ./start-worker.sh"
    env_file: .env
    environment:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      - db
      - redis
      - mailhog
      - otel-collector
    volumes:
      - "./src:/code/src"
      - "./pyproject.toml:/code/pyproject.toml"
    tty: true

  db:
    image: postgres:17-alpine
    container_name: booking_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
    env_file: .env.dev
    volumes:
      - pg_data:/var/lib/postgresql/dataStaff

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
