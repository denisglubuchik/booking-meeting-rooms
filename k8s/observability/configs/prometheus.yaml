global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: cnpg-postgresql
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [booking]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        regex: booking-postgres-cluster
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
        regex: instance
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
        target_label: cnpg_role

  - job_name: cnpg-pgbouncer
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [booking]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        regex: booking-postgres-cluster
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
        regex: pooler
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
        target_label: pooler
      - source_labels: [__meta_kubernetes_pod_label_database_access]
        target_label: database_access
