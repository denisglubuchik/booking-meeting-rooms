apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer-network-policy
  namespace: booking
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
          - { key: app, operator: In, values: [ backend, worker, migrations ] }
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  - to:
      - podSelector:
          matchLabels:
            app: postgres
    ports:
      - protocol: TCP
        port: 5432
