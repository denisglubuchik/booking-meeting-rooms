apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: booking
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 70
      containers:
        - name: backend
          image: booking-backend:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          command:
            - /bin/sh
            - -c
          args:
            - >-
              cd /code/src &&
              exec uv run --no-sync uvicorn api.main:app
              --host 0.0.0.0
              --port 8000
              --timeout-graceful-shutdown 60
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
